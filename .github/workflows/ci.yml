name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate sfdx-project.json
        run: python -m json.tool sfdx-project.json > /dev/null

      - name: Validate zip_fix.py syntax
        run: python -m py_compile zip_fix.py
